const $=id=>document.getElementById(id);let count=3;let enabled=new Set();let lang='it';let phraseIndex=0;let last=[];
try{const s=JSON.parse(localStorage.getItem('barrage-deco-setup')||'{}');if(Number.isInteger(s.count)&&s.count>=1&&s.count<=5)count=s.count;if(Array.isArray(s.enabled))enabled=new Set(s.enabled.filter(c=>expansions.some(e=>e[0]===c)));if(translations[s.lang])lang=s.lang;if(Number.isInteger(s.phraseIndex)&&s.phraseIndex>=0&&s.phraseIndex<4)phraseIndex=s.phraseIndex;}catch(e){}
function persist(){try{localStorage.setItem('barrage-deco-setup',JSON.stringify({count,enabled:[...enabled],lang,phraseIndex}))}catch(e){}}
function tr(){return translations[lang]}
function text(tag,cls,value){const n=document.createElement(tag);n.className=cls;n.textContent=value;return n}
function nationName(n){return tr().nations[nations.findIndex(x=>x[0]===n[0])]}
function origin(c){return c==='base'?tr().gameBase:expansions.find(x=>x[0]===c)?.[1]||c}
function pools(){return{people:people.filter(x=>x[1]==='base'||enabled.has(x[1])),nations:nations.filter(x=>x[1]==='base'||enabled.has(x[1]))}}
function validate(){const p=pools();let msg='';if(p.nations.length<count)msg=tr().shortage.replaceAll('{count}',count).replace('{available}',p.nations.length);else if(p.people.length<count)msg=tr().charactersShort;$('warning').textContent=msg;$('warning').classList.toggle('hidden',!msg);$('generate').disabled=!!msg}
function render(){document.documentElement.lang=lang;$('language').value=lang;const t=tr();for(const [id,k] of [['languageLabel','language'],['intro','intro'],['configTitle','config'],['playersLabel','players'],['contentLabel','content'],['base','base'],['all','all'],['expNote','note'],['phraseLabel','phrase'],['resultTitle','result'],['copy','copy'],['reroll','reroll'],['footer','footer']])$(id).textContent=t[k];
const s=$('players');s.replaceChildren();for(let i=1;i<=5;i++){const b=text('button',i===count?'active':'',i);b.type='button';b.setAttribute('aria-pressed',String(i===count));b.onclick=()=>{count=i;changed()};s.append(b)}
const checks=$('expansions');checks.replaceChildren();for(const [code,name] of expansions){const wrap=text('label','check','');const input=document.createElement('input');input.type='checkbox';input.checked=enabled.has(code);input.onchange=()=>{if(input.checked)enabled.add(code);else enabled.delete(code);changed()};wrap.append(input,document.createTextNode(name));checks.append(wrap)}
$('base').classList.toggle('active',enabled.size===0);$('all').classList.toggle('active',enabled.size===expansions.length);const phrase=$('phrase');phrase.replaceChildren();t.phrases.forEach((v,i)=>{const opt=new Option(v,String(i));phrase.append(opt)});phrase.value=String(phraseIndex);$('generate').textContent=t.phrases[phraseIndex];validate();if(last.length)renderResults();}
function changed(){last=[];$('resultPanel').classList.add('hidden');render();persist()}
function randomInt(max){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){const p=pools();if(p.people.length<count||p.nations.length<count){validate();return}const persons=shuffle(p.people),nats=shuffle(p.nations);last=Array.from({length:count},(_,i)=>({person:persons[i],nation:nats[i]}));renderResults();$('resultPanel').classList.remove('hidden');$('copyStatus').textContent=''}
function renderResults(){const list=$('results');list.replaceChildren();last.forEach((x,i)=>{const card=text('div','result',''),num=text('div','num',i+1),info=text('div','info','');info.append(text('div','who',x.person[0]));info.append(text('div','nation',`${x.nation[2]} ${nationName(x.nation)}`));if(x.person[1]!=='base')info.append(text('div','meta',`${tr().person}: ${origin(x.person[1])}`));if(x.nation[1]!=='base')info.append(text('div','meta',`${tr().nation}: ${origin(x.nation[1])}`));card.append(num,info);list.append(card)});$('resultPhrase').textContent=tr().phrases[phraseIndex]}
async function copyResults(){const t=tr();const out=[`BARRAGE · ${count} ${t.players.toLowerCase()}`,`${t.selection}: ${t.phrases[phraseIndex]}`,`${t.expansion}: ${enabled.size?[...enabled].map(origin).join(', '):t.base}`,...last.map((x,i)=>`${t.player} ${i+1}: ${x.person[0]} | ${nationName(x.nation)}`)].join('\n');let ok=false;try{await navigator.clipboard.writeText(out);ok=true}catch(e){const a=document.createElement('textarea');a.value=out;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();try{ok=document.execCommand('copy')}catch(e){}a.remove()}$('copyStatus').textContent=ok?t.copied:t.copyFail}
$('language').onchange=()=>{lang=$('language').value;render();persist()};$('base').onclick=()=>{enabled.clear();changed()};$('all').onclick=()=>{enabled=new Set(expansions.map(x=>x[0]));changed()};$('phrase').onchange=()=>{phraseIndex=Number($('phrase').value);last=[];$('resultPanel').classList.add('hidden');render();persist()};$('generate').onclick=generate;$('reroll').onclick=generate;$('copy').onclick=copyResults;render();
</script><script>if ("serviceWorker" in navigator && location.protocol === "https:") {window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
