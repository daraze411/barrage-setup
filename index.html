<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barrage Setup Generator</title>
<meta name="theme-color" content="#0f1714">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
<style>
/* Layout: one centred column, sections as gilded "plates" on a petrol board; results as concession certificates; map plate beside its ledger on wide screens */
:root{
  color-scheme: dark;
  --board:#0f1714;        /* deep petrol board */
  --plate:#17221d;        /* panel */
  --plate-2:#1f2c26;      /* raised panel */
  --line:#3a4a3f;         /* quiet rules */
  --gold:#d9b46a;         /* antique gold */
  --gold-hi:#f1d796;      /* gold highlight */
  --gold-lo:#8a6a34;      /* gold shadow */
  --ivory:#f3ead0;        /* text */
  --mute:#a9b3a2;         /* secondary text */
  --water:#7fb3b8;        /* reservoir blue, used for map hints */
  --focus:#e39ac0;        /* focus ring */
  --warn:#e8a079;
  --ink:#121a16;          /* text on gold */
  --f-display:"Limelight","Georgia",serif;
  --f-name:"Cormorant Garamond","Georgia","Times New Roman",serif;
  --f-ui:"Jost","Trebuchet MS","Segoe UI",Arial,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html{background:var(--board)}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(217,180,106,.10), transparent 60%),
    repeating-linear-gradient(90deg, rgba(217,180,106,.035) 0 1px, transparent 1px 72px),
    var(--board);
  color:var(--ivory);
  font:16px/1.5 var(--f-ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.top{display:flex;justify-content:flex-end;padding-top:14px}
.lang{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lang select{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:6px 28px 6px 10px;letter-spacing:.06em;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:6px 0 4px}
.crest{width:112px;height:112px;border-radius:6px;box-shadow:0 0 0 1px var(--gold-lo),0 0 0 5px var(--board),0 0 0 6px rgba(217,180,106,.45),0 18px 40px rgba(0,0,0,.5)}
.hero h1{margin:0;font:400 clamp(44px,9vw,82px)/.92 var(--f-display);letter-spacing:.06em;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 48%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .kicker{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.hero .kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);max-width:220px}
.hero p{margin:10px 0 0;color:var(--mute);max-width:46ch;text-wrap:pretty}

/* ---------- Plates ---------- */
.plate{position:relative;background:linear-gradient(180deg,var(--plate-2),var(--plate));border:1px solid var(--line);border-radius:var(--r);padding:22px 20px}
.plate::before{content:"";position:absolute;inset:5px;border:1px solid rgba(217,180,106,.18);border-radius:2px;pointer-events:none}
.plate-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.plate-h h2{margin:0;font:600 13px/1.2 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.plate-h h2::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--gold);flex:none}
.plate-h .aside{font-size:13px;color:var(--mute)}

/* ---------- Players ---------- */
.players{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pl{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--board);border:1px solid var(--line);
  clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);cursor:pointer;transition:background .2s,color .2s}
.pl span{font:600 clamp(26px,6vw,40px)/1 var(--f-name);color:var(--mute)}
.pl small{position:absolute;bottom:10%;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);opacity:.8}
.pl:hover span{color:var(--ivory)}
.pl[aria-checked="true"]{background:linear-gradient(160deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));}
.pl[aria-checked="true"] span,.pl[aria-checked="true"] small{color:var(--ink)}
.pl:focus-visible{outline:none;background:var(--plate-2);box-shadow:inset 0 0 0 2px var(--focus)}

/* ---------- Content toggles ---------- */
.quick{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--mute);cursor:pointer}
.ghost:hover{color:var(--ivory);border-color:var(--gold-lo)}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.box{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--board);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-width:0;transition:border-color .2s,background .2s}
.box .tick{flex:none;width:20px;height:20px;margin-top:2px;border:1px solid var(--gold-lo);transform:rotate(45deg) scale(.78);display:grid;place-items:center}
.box .tick::after{content:"";width:9px;height:9px;background:var(--gold);transform:scale(0);transition:transform .15s}
.box[aria-checked="true"]{border-color:var(--gold);background:rgba(217,180,106,.07)}
.box[aria-checked="true"] .tick::after{transform:scale(1)}
.box b{display:block;font:600 19px/1.15 var(--f-name);color:var(--ivory)}
.box em{display:block;font-style:normal;font-size:12px;letter-spacing:.06em;color:var(--mute);margin-top:3px}
.box.base{cursor:default;border-style:dashed}
.box.base .tick::after{transform:scale(1);background:var(--mute)}
.pool{margin-top:14px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.pool strong{color:var(--ivory);font-weight:500}
.alert{margin-top:12px;padding:10px 14px;border-left:3px solid var(--warn);background:rgba(232,160,121,.08);color:var(--warn);font-size:14px}

/* ---------- Launch ---------- */
.launch{text-align:center}
.launch .plate-h{justify-content:center}
.phrases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.ph{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:italic 500 18px/1.25 var(--f-name);color:var(--mute);cursor:pointer;text-align:center;min-width:0;transition:all .2s}
.ph:hover{color:var(--ivory);border-color:var(--gold-lo)}
.ph[aria-checked="true"]{color:var(--gold-hi);border-color:var(--gold);background:rgba(217,180,106,.08)}
.go{position:relative;display:block;width:100%;padding:20px 22px;border:0;border-radius:var(--r);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,#b8914d);color:var(--ink);
  font:600 15px/1.3 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 26px rgba(0,0,0,.4);transition:transform .15s,filter .2s}
.go::before,.go::after{content:"◆";position:absolute;top:50%;transform:translateY(-50%);font-size:10px;opacity:.6}
.go::before{left:16px}.go::after{right:16px}
.go:hover:not(:disabled){filter:brightness(1.06)}
.go:active:not(:disabled){transform:translateY(1px)}
.go:disabled{background:var(--plate-2);color:var(--mute);box-shadow:none;cursor:not-allowed;outline:1px dashed var(--line);outline-offset:-1px}
.go .q{display:block;font:italic 600 22px/1.2 var(--f-name);letter-spacing:0;text-transform:none;margin-top:2px}

/* ---------- Certificates ---------- */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cert{position:relative;background:
  repeating-linear-gradient(135deg,rgba(217,180,106,.035) 0 2px,transparent 2px 9px),var(--board);
  border:1px solid var(--gold-lo);padding:16px 16px 14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.cert::before{content:"";position:absolute;inset:4px;border:1px solid rgba(217,180,106,.28);pointer-events:none;
  clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
.cert-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-variant-numeric:tabular-nums}
.cert-top .no{font:600 14px/1 var(--f-name);letter-spacing:.08em}
.nation{display:flex;align-items:center;gap:12px}
.flag{width:42px;height:28px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 0 3px rgba(217,180,106,.35)}
.nation b{font:600 26px/1.05 var(--f-name);color:var(--ivory);overflow-wrap:anywhere}
.xo{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.mono{flex:none;width:44px;height:44px;display:grid;place-items:center;font:600 18px/1 var(--f-name);color:var(--gold-hi);
  background:var(--plate-2);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);box-shadow:inset 0 0 0 1px var(--gold)}
.xo .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.xo b{display:block;font:italic 600 21px/1.1 var(--f-name);color:var(--gold-hi);overflow-wrap:anywhere}
.src{align-self:flex-start;font-size:11px;letter-spacing:.08em;color:var(--water);border:1px solid rgba(127,179,184,.35);border-radius:999px;padding:2px 9px}
.src.is-base{color:var(--mute);border-color:var(--line)}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--mute);font:italic 500 19px/1.35 var(--f-name)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 200px;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px solid var(--gold-lo);border-radius:var(--r);padding:12px 14px;color:var(--gold-hi);font-size:14px;letter-spacing:.06em;cursor:pointer;transition:background .2s}
.btn:hover:not(:disabled){background:rgba(217,180,106,.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.dealt .cert{animation:deal .5s cubic-bezier(.2,.8,.2,1) both}

/* ---------- Map ---------- */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.mapframe{position:relative;border:1px solid var(--gold-lo);padding:6px;background:var(--board);max-width:100%}
.mapframe svg{display:block;width:100%;height:auto}
.lakelbl rect{fill:rgba(12,18,16,.78);stroke:rgba(243,234,208,.55);stroke-width:1.5}
.lakelbl text{fill:var(--ivory);font:600 25px var(--f-ui);letter-spacing:1px}
.lakelbl.on rect{fill:var(--gold);stroke:var(--gold-hi)}
.lakelbl.on text{fill:var(--ink)}
.has-dams .lakelbl:not(.on){opacity:.55}
.med .halo{fill:rgba(10,14,12,.72)}
.med .ring{fill:url(#goldGrad);stroke:#5d4520;stroke-width:1.5}
.med .disc{fill:#f6ecce;stroke:#8a6a34;stroke-width:1.5}
.med text{fill:#1a1a14;font:600 34px var(--f-ui)}
.med .pulse{fill:none;stroke:var(--gold-hi);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes drop{0%{transform:translateY(-26px) scale(.6);opacity:0}70%{transform:translateY(3px) scale(1.04);opacity:1}100%{transform:none;opacity:1}}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.med.anim .body{animation:drop .55s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
.med.anim .pulse{animation:pulse 1.4s ease-out .45s 2}
.ledger{display:flex;flex-direction:column;gap:12px}
.zone{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--board);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.zone .lv{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 18px/1 var(--f-ui);color:var(--ink);background:radial-gradient(circle,#f6ecce 58%,var(--gold) 60%);box-shadow:0 0 0 1px var(--gold-lo)}
.zone .zn{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.zone .zd{display:block;font-size:13px;color:var(--mute)}
.zone .code{font:600 34px/1 var(--f-name);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.bldgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.bld{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--board);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.bld .lv{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 16px/1 var(--f-ui);color:var(--ink);background:radial-gradient(circle,#f6ecce 58%,var(--gold) 60%);box-shadow:0 0 0 1px var(--gold-lo)}
.bld b{font:600 20px/1.15 var(--f-name);color:var(--gold-hi)}
.bld .req{display:block;margin-top:4px;font-size:12px;color:var(--water)}
.bldgs.dealt .bld{animation:bldIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes bldIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hint{font-size:13px;color:var(--mute);margin:0;text-wrap:pretty}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}

/* ---------- Duel / footer ---------- */
.duel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--mute)}
.duel b{font:600 20px/1.1 var(--f-name);color:var(--mute)}
.soon{font-size:11px;letter-spacing:.3em;color:var(--gold);border:1px solid var(--gold-lo);padding:4px 10px}
footer{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.04em;padding-top:6px}
footer .orn{color:var(--gold-lo);letter-spacing:.6em;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;transition:all .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .mapgrid{grid-template-columns:1fr}
  .ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .zone{grid-template-columns:1fr;text-align:center;justify-items:center;gap:6px;padding:10px 6px}
  .zone .zd{display:none}
  .zone .code{font-size:30px}
  .ledger>.hint,.ledger>.btn,.ledger>.legend{grid-column:1/-1}
}
@media (max-width:520px){
  .hero{grid-template-columns:1fr;justify-items:start;gap:14px}
  .crest{display:none}
  .phrases{grid-template-columns:1fr}
  .plate{padding:18px 14px}
  .players{gap:6px}
  .pl small{display:none}
  .boxes{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .box{padding:10px;gap:8px}
  .box b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== Storage (safe) ===== */
const KEY="bsg2:";
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};

/* ===== Randomness ===== */
function randomInt(n){
  try{ if(window.crypto&&crypto.getRandomValues){
    const lim=Math.floor(4294967296/n)*n, a=new Uint32Array(1);
    do{crypto.getRandomValues(a)}while(a[0]>=lim); return a[0]%n; } }catch(e){}
  return Math.floor(Math.random()*n);
}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===== State ===== */
const S={
  lang:["it","en","fr","de"].includes(store.get("lang","it"))?store.get("lang","it"):"it",
  players:Math.min(5,Math.max(1,+store.get("players",3)||3)),
  owned:new Set((store.get("owned",[])||[]).filter(k=>SRC_NAME[k])),
  phraseSet:[],phrase:null,
  pairs:null,dams:null,bld:null,stale:false,animate:false,animDams:false,animBld:false
};
const t=()=>T[S.lang];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function poolXO(){return XO.filter(x=>x.s==="base"||S.owned.has(x.s))}
function poolNat(){return NATIONS.filter(x=>x.s==="base"||S.owned.has(x.s))}
function canDraw(){return poolNat().length>=S.players&&poolXO().length>=S.players}
function hasDams(){return S.players>=1&&S.players<=4}

/* ===== Draw ===== */
function drawPairs(){
  const xs=shuffle(poolXO()).slice(0,S.players), ns=shuffle(poolNat()).slice(0,S.players);
  S.pairs=xs.map((x,i)=>({xo:x,nat:ns[i]}));
}
function hasBld(){return S.owned.has("lp")}
function drawBld(){S.bld=hasBld()?shuffle(BUILDINGS).slice(0,5):null}
function drawDams(){S.dams=hasDams()?[randomInt(4)+1,randomInt(3)+1,randomInt(3)+1]:null}

/* ===== Phrases ===== */
function rotatePhrases(){
  const last=store.get("phraseSet",null), lastKey=Array.isArray(last)?last.slice().sort((a,b)=>a-b).join(","):"";
  let set,tries=0;
  do{set=shuffle([...Array(12).keys()]).slice(0,4);tries++}while(set.slice().sort((a,b)=>a-b).join(",")===lastKey&&tries<20);
  S.phraseSet=set;S.phrase=null;store.set("phraseSet",set);
}

/* ===== Flags (inline SVG, render everywhere unlike emoji on Windows) ===== */
function flag(k){
  const w=30,h=20;let b="";
  const v=(c)=>c.map((col,i)=>`<rect x="${i*10}" y="0" width="10" height="20" fill="${col}"/>`).join("");
  const hz=(c)=>c.map((col,i)=>`<rect x="0" y="${i*20/3}" width="30" height="${20/3+.05}" fill="${col}"/>`).join("");
  if(k==="it")b=v(["#009246","#f4f1ea","#ce2b37"]);
  else if(k==="fr")b=v(["#0055a4","#f4f1ea","#ef4135"]);
  else if(k==="de")b=hz(["#111","#dd0000","#ffce00"]);
  else if(k==="nl")b=hz(["#ae1c28","#f4f1ea","#21468b"]);
  else if(k==="jp")b=`<rect width="30" height="20" fill="#f4f1ea"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>`;
  else if(k==="br")b=`<rect width="30" height="20" fill="#009c3b"/><path d="M15 2.5 27 10 15 17.5 3 10Z" fill="#ffdf00"/><circle cx="15" cy="10" r="4.4" fill="#002776"/><path d="M10.8 9.2q4.4-1.2 8.4 1.4" stroke="#f4f1ea" stroke-width=".8" fill="none"/>`;
  else if(k==="us"){for(let i=0;i<13;i++)b+=`<rect x="0" y="${i*20/13}" width="30" height="${20/13+.05}" fill="${i%2?"#f4f1ea":"#b22234"}"/>`;
    b+=`<rect width="12" height="${20/13*7}" fill="#3c3b6e"/>`;
    for(let r=0;r<4;r++)for(let c=0;c<5;c++)b+=`<circle cx="${1.4+c*2.3+(r%2)*1.1}" cy="${1.4+r*2.6}" r=".45" fill="#f4f1ea"/>`;}
  return `<svg class="flag" viewBox="0 0 ${w} ${h}" aria-hidden="true">${b}</svg>`;
}
function mono(name){const p=name.replace(/^Dr\.\s*/,"").split(/\s+/);return (p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function srcTag(s){return s==="base"?`<span class="src is-base">${esc(t().base)}</span>`:`<span class="src">${esc(SRC_NAME[s])}</span>`}

/* ===== Render ===== */
function renderStatic(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t()[el.dataset.t];if(typeof v==="string")el.textContent=v});
  $("lang").value=S.lang;
  $("map-title").textContent=t().dams;
}
function renderPlayers(){
  $("players").innerHTML=[1,2,3,4,5].map(n=>`<button class="pl" type="button" role="radio" aria-checked="${n===S.players}" tabindex="${n===S.players?0:-1}" data-n="${n}" aria-label="${n} ${esc(t().players)}"><span>${n}</span>${n===1?`<small>${esc(t().plSolo)}</small>`:""}</button>`).join("");
}
function renderBoxes(){
  const cx=k=>XO.filter(x=>x.s===k).length, cn=k=>NATIONS.filter(x=>x.s===k).length;
  let h=`<div class="box base" aria-hidden="false"><span class="tick"></span><span><b>${esc(t().baseBox)}</b><em>${esc(t().baseNote)} · ${esc(t().adds(cx("base"),cn("base")))}</em></span></div>`;
  h+=CONTENT.map(c=>`<button class="box" type="button" role="checkbox" aria-checked="${S.owned.has(c.k)}" data-k="${c.k}"><span class="tick"></span><span><b>${esc(c.name)}</b><em>+ ${esc(t().adds(cx(c.k),cn(c.k)))}</em></span></button>`).join("");
  $("boxes").innerHTML=h;
  $("pool").innerHTML=t().pool(poolXO().length,poolNat().length);
  const err=!canDraw(); $("err").hidden=!err; if(err)$("err").textContent=t().errFive;
}
function renderPhrases(){
  $("phrases").innerHTML=S.phraseSet.map(i=>`<button class="ph" type="button" role="radio" aria-checked="${S.phrase===i}" data-i="${i}">${esc(t().phrases[i])}</button>`).join("");
  const go=$("go"), ok=S.phrase!=null&&canDraw();
  go.disabled=!ok;
  go.innerHTML=S.phrase==null?esc(t().pickHint):`<span class="q">${esc(t().phrases[S.phrase])}</span>`;
}
function renderResults(){
  const box=$("certs");
  if(!S.pairs){
    box.innerHTML=`<div class="empty">${esc(S.stale?t().stale:t().empty)}</div>`;
    $("re-pairs").disabled=true;$("copy").disabled=true;$("res-aside").textContent="";
  }else{
    box.innerHTML=`<div class="certs${S.animate?" dealt":""}">`+S.pairs.map((p,i)=>`
      <article class="cert" style="animation-delay:${i*90}ms">
        <div class="cert-top"><span>${esc(t().cert)}</span><span class="no">N° ${String(i+1).padStart(2,"0")}</span></div>
        <div class="nation">${flag(p.nat.k)}<b>${esc(t().nations[p.nat.k])}</b></div>
        <div class="xo"><span class="mono" aria-hidden="true">${mono(p.xo.n)}</span><span><span class="lbl">${esc(t().player)} ${i+1} · ${esc(t().xo)}</span><b>${esc(p.xo.n)}</b></span></div>
        <div class="srcs">${srcTag(p.nat.s)}${p.xo.s!==p.nat.s?srcTag(p.xo.s):""}</div>
      </article>`).join("")+`</div>`;
    $("re-pairs").disabled=false;$("copy").disabled=false;
    $("res-aside").textContent=`${S.pairs.length} ${t().players.toLowerCase()}`;
  }
  S.animate=false;
}
function renderMap(){
  const show=hasDams();
  $("dam-sec").hidden=!show; $("no-dams").hidden=show; if(!show)$("no-dams").textContent=t().noDams;
  if(!show)return;
  const d=S.dams;
  $("mapframe").classList.toggle("has-dams",!!d);
  let L="";
  ZONES.forEach((z,zi)=>LAKES[z].forEach((p,i)=>{
    const on=d&&d[zi]===i+1;
    L+=`<g class="lakelbl${on?" on":""}"><rect x="${p[0]-40}" y="${p[1]-20}" width="80" height="40" rx="20"/><text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central">${z}${i+1}</text></g>`;
  }));
  $("labels").innerHTML=L;
  let M="";
  if(d)ZONES.forEach((z,zi)=>{const p=LAKES[z][d[zi]-1],lv=zi+1;
    M+=`<g class="med${S.animDams?" anim":""}" transform="translate(${p[2]} ${p[3]})" style="--d:${zi}">
      <circle class="pulse" r="31"/>
      <g class="body" style="animation-delay:${zi*120}ms"><circle class="halo" r="38"/><circle class="ring" r="32"/><circle class="disc" r="25"/>
      <text text-anchor="middle" dominant-baseline="central" y="1">${lv}</text></g></g>`;});
  $("meds").innerHTML=M;
  $("zones").innerHTML=ZONES.map((z,zi)=>`<div class="zone"><span class="lv">${zi+1}</span><span><span class="zn">${esc(t().zone[z])}</span><span class="zd">${esc(t().level(zi+1))}</span></span><span class="code">${d?z+d[zi]:"—"}</span></div>`).join("");
  $("legend").innerHTML=d?"":`<span>${esc(t().damsWait)}</span>`;
  $("re-dams").disabled=!S.pairs&&!d;
  S.animDams=false;
}
function renderBld(){
  const show=hasBld(); $("bld-sec").hidden=!show; if(!show)return;
  const b=S.bld;
  $("bldgs").innerHTML=b?`<div class="bldgs${S.animBld?" dealt":""}">`+b.map((n,i)=>`<div class="bld" style="animation-delay:${i*80}ms"><span class="lv">${i+1}</span><span><b>${esc(n)}</b>${BLD_REQ[n]?`<span class="req">${esc(t()[BLD_REQ[n]])}</span>`:""}</span></div>`).join("")+`</div>`
    :`<div class="empty">${esc(t().bldWait)}</div>`;
  $("re-bld").disabled=!b;
  S.animBld=false;
}
function renderAll(){renderStatic();renderPlayers();renderBoxes();renderPhrases();renderResults();renderMap();renderBld()}

/* ===== Actions ===== */
function invalidate(){if(S.pairs||S.dams||S.bld){S.pairs=null;S.dams=null;S.bld=null;S.stale=true}}
function savePrefs(){store.set("players",S.players);store.set("owned",[...S.owned]);store.set("lang",S.lang)}
function setPlayers(n){if(n===S.players)return;S.players=n;invalidate();savePrefs();renderPlayers();renderBoxes();renderPhrases();renderResults();renderMap();renderBld()}
$("players").addEventListener("click",e=>{const b=e.target.closest(".pl");if(b)setPlayers(+b.dataset.n)});
$("players").addEventListener("keydown",e=>{
  const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!d)return; e.preventDefault();
  const n=Math.min(5,Math.max(1,S.players+d)); setPlayers(n); $("players").querySelector(`[data-n="${n}"]`).focus();
});
$("boxes").addEventListener("click",e=>{const b=e.target.closest("button.box");if(!b)return;const k=b.dataset.k;
  S.owned.has(k)?S.owned.delete(k):S.owned.add(k);invalidate();savePrefs();renderBoxes();renderPhrases();renderResults();renderMap();renderBld();
  $("boxes").querySelector(`[data-k="${k}"]`).focus()});
$("q-base").onclick=()=>{S.owned.clear();invalidate();savePrefs();renderAll()};
$("q-all").onclick=()=>{CONTENT.forEach(c=>S.owned.add(c.k));invalidate();savePrefs();renderAll()};
$("phrases").addEventListener("click",e=>{const b=e.target.closest(".ph");if(!b)return;S.phrase=+b.dataset.i;renderPhrases();$("phrases").querySelector(`[data-i="${S.phrase}"]`).focus()});
$("go").onclick=()=>{if(!canDraw()||S.phrase==null)return;drawPairs();drawDams();drawBld();S.stale=false;S.animate=true;S.animDams=true;S.animBld=true;renderResults();renderMap();renderBld();
  $("res-sec").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})};
$("re-pairs").onclick=()=>{if(!canDraw())return;drawPairs();if(!S.dams)drawDams(),S.animDams=true;if(!S.bld&&hasBld())drawBld(),S.animBld=true;S.animate=true;renderResults();renderMap();renderBld()};
$("re-dams").onclick=()=>{drawDams();S.animDams=true;renderMap()};
$("re-bld").onclick=()=>{drawBld();S.animBld=true;renderBld()};
$("lang").onchange=e=>{S.lang=e.target.value;savePrefs();renderAll()};

function resultText(){
  const L=t();let s=`BARRAGE · Setup (${S.pairs.length})\n`;
  s+=S.pairs.map((p,i)=>`${L.player} ${i+1}: ${FLAG_EMOJI[p.nat.k]} ${L.nations[p.nat.k]} — ${p.xo.n}`).join("\n");
  if(S.dams)s+=`\n${L.dams}: `+ZONES.map((z,zi)=>`${L.zone[z]} ${z}${S.dams[zi]} (${L.lvShort(zi+1)})`).join(" · ");
  if(S.bld)s+=`\n${L.bld}: `+S.bld.map(n=>BLD_REQ[n]?`${n} (${L[BLD_REQ[n]]})`:n).join(" · ");
  return s;
}
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1800)}
$("copy").onclick=()=>{
  if(!S.pairs)return;const txt=resultText();
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;opacity:0;top:0;left:0";document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?t().copied:t().copyFail)};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(t().copied),fallback)}else fallback()}catch(e){fallback()}
};

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){rotatePhrases();renderPhrases()}});

rotatePhrases();
renderAll();
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>
